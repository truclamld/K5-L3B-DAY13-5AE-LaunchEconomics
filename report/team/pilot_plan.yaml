# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
# Số D1 do src/lab13.py tính (hàm nhiem_vu_d); z chính xác 1,95996 và 0,84162.
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: co_mau(0,70; 0,75) = 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; n = 1.251 × 2,48 = 3.103 mỗi nhóm → 42 nhân viên mỗi nhóm, tổng 84 > 40: không đủ người.
#   c) 20 nhân viên mỗi nhóm: hiệu dụng tối đa = c / ICC = 20 / 0,02 = 1.000 < 1.251: không đạt, dù mỗi người xử lý bao nhiêu yêu cầu.
#   d) 6 depot mỗi nhóm: hiệu dụng tối đa = 6 / 0,02 = 300 (và chỉ 6 cụm, dưới 20).
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m / (0,98 + 0,02m) ≥ 859 → m ≥ 299 yêu cầu mỗi người (DE = 6,96).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng depot, cùng phạm vi noi_dia + hang_nang.
#   2. Chia ngẫu nhiên hay do người chọn: ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot; quản lý không được chọn người.
#   3. Ảnh hưởng gián tiếp và cách giảm: có rủi ro nhân viên cùng depot chia sẻ câu trả lời của trợ lý; giảm bằng phân quyền theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trong file này trước ngày bắt đầu 2026-12-07 (mde 0,06; decision_date 2027-01-12).
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 nhân viên mỗi nhóm (40 nhân viên của LogiX-VN).
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chia theo nhân viên tách được tác động nhưng tối đa 1.000 < 1.251 nên không thấy được mức chênh 5 điểm.
#   Nhóm chấp nhận mức chênh phát hiện được là 6 điểm (n = 859, m ≥ 299 mỗi người). Con số bất lợi: nếu tác động thật
#   chỉ là 5 điểm thì power còn 0,64 (statsmodels NormalIndPower, n = 859), tức khoảng 1/3 khả năng bỏ lỡ.
#   Không chọn chia theo yêu cầu (tràn tác động cao: một nhân viên vừa dùng vừa không dùng) và không chọn theo depot (chỉ 6 cụm, tối đa 300).
#   Thời lượng: trong phạm vi có ≈ 30,7 yêu cầu mỗi nhân viên mỗi ngày (1.500 / 40 × 982 / 1.200) → 299 yêu cầu cần ≈ 10 ngày ở bước 0.50.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại 4,25% (51/1.200) toàn mẫu; 3,97% (39/982) trong phạm vi noi_dia + hang_nang.
#   Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu, nên dùng ngưỡng so với đối chứng: cao hơn đối chứng từ 2 điểm, kèm trần tuyệt đối 6%.
#
# Số tham chiếu cho luật chi phí (A3, A4, B4; simulated vì dùng cột _simulated):
#   Chi phí mỗi việc thành công trong phạm vi 3.414 đ; cộng cố định 40 triệu/tháng: 4.599 đ (0,38×) ở 45.000 yc/tháng,
#   5.784 đ (0,48×) ở nửa khối lượng. Xem lại 100%: 11.743 đ (0,98×), nên tuần 1 không áp luật chi phí.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"   # người duy nhất có quyền quyết định mở rộng hoặc dừng pilot
  scope: "Chỉ loại noi_dia và hang_nang, cả 12 depot (cần đủ 40 nhân viên để có 20 cụm mỗi nhóm). Lý do theo A3 [simulated]: noi_dia 2.696 đ/việc (0,22× của 12.000 đ, thành công 95,0%), hang_nang 8.221 đ (0,69×, 74,1%). Loại quoc_te: 22.515 đ (1,88×), thành công 27,3%, chạy lại 3 lần không giúp (lần 1 đúng 30%, lần 2 chỉ 11,4%). Loại doi_tac: 10.215 đ (0,85×), sát ngưỡng và có điều khoản riêng."
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 4 → 10 → 20 nhân viên nhóm trợ lý; bước 0.10 và 0.25 mỗi bước một tuần; bước 0.50 kéo dài 2 tuần (cần ≈ 10 ngày để mỗi người đạt 299 yêu cầu); chỉ đo chỉ số chính ở bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận: 5 điểm cần 1.251 > trần 1.000 khi chia 20 + 20 nhân viên
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                # cỡ mẫu hiệu dụng; thực tế 20 × 299 = 5.980 yêu cầu mỗi nhóm
    design_effect: 6.96           # 1 + (299 − 1) × 0,02
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng thời gian, cùng depot, cùng phạm vi noi_dia + hang_nang; bốc thăm bằng code với seed ghi trước, phân tầng theo depot"
    spillover_risk: "Có, mức trung bình: nhân viên cùng depot có thể chia sẻ câu trả lời của trợ lý cho người ở nhóm đối chứng. Giảm bằng phân quyền trợ lý theo tài khoản, log lượt mở trợ lý theo staff_id (nhóm đối chứng phải bằng 0), yêu cầu vẫn được chia theo luồng hiện tại, nhân viên không tự chọn"
    predeclared: "Có: chỉ số chính, mde 0,06, alpha 0,05, luật dừng và decision_date chốt trong file này trước ngày bắt đầu 2026-12-07; Giám đốc vận hành ký chấp nhận power 0,64 nếu tác động thật chỉ 5 điểm"
  stop_rules:
    - "NẾU tỉ lệ mở lại trong 7 ngày của nhóm trợ lý cao hơn nhóm đối chứng từ 2 điểm trở lên hoặc vượt 6% (đợt chạy thử: 3,97% trong phạm vi) TRONG 3 ngày liên tiếp (đo hằng ngày trên cửa sổ 7 ngày) THÌ Giám đốc vận hành tắt trợ lý bằng cờ tắt trong 30 phút và Kỹ sư trưởng agent rà 20 trace mở lại trong 2 ngày KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU có từ 1 ca hoàn tiền trùng cho cùng một đơn (ca 20) hoặc 1 tin nhắn “đã hoàn” không có bản ghi sổ cái ok cùng trace_id (ca 7) TRONG bất kỳ lần đối soát mỗi giờ nào THÌ Kỹ sư trưởng agent tắt trợ lý trong 30 phút, báo Giám đốc vận hành và Kế toán trưởng thu hồi khoản hoàn thừa trong 2 ngày KHÔNG THÌ không được bật lại trợ lý"
    - "NẾU chi phí mỗi việc thành công trong phạm vi, đã cộng chi phí cố định và dùng phút xem lại, làm lại đo thật, vượt 8.000 đ (0,67× của 12.000 đ; mô hình chạy thử 5.784 đ ở nửa khối lượng, simulated) TRONG 2 tuần liên tiếp tính từ tuần 2 THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn tối đa 2 lần chạy trong 3 ngày KHÔNG THÌ không được mở bước 0.50"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo, chia số được xem lại) vượt 40% (đợt chạy thử: 27,12%) hoặc dưới 60% yêu cầu của nhóm trợ lý được mở bằng trợ lý TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên nhóm trợ lý và báo cáo nguyên nhân trong 3 ngày KHÔNG THÌ không được sang bước rollout tiếp theo"
  interim_looks: "chỉ kiểm tra chỉ số an toàn: tỉ lệ mở lại 7 ngày hằng ngày và đối soát sổ cái mỗi giờ; không xem chỉ số chính trước decision_date"
  rollback: "Giám đốc vận hành (ngoài giờ: Kỹ sư trưởng agent trực) bấm cờ tắt trợ lý, hiệu lực trong 30 phút; yêu cầu đang xử lý chuyển sang hàng đợi nhân viên kèm tóm tắt và trace_id; khách được phục vụ bằng luồng nhân viên tự làm như nhóm đối chứng (6 phút, 12.000 đ mỗi yêu cầu)"
  decision_date: "2027-01-12"     # bắt đầu 2026-12-07; bước 0.50 từ 2026-12-21 đến 2027-01-03; thêm 7 ngày theo dõi mở lại đến 2027-01-10
  simulated_inputs:
    - "phut_xem_lai_simulated: 890 phút = 1.780.000 đ (simulated)"
    - "phut_lam_lai_simulated: 1.132 phút = 2.264.000 đ (simulated)"
    - "Chi phí mỗi việc thành công toàn mẫu 4.472 đ (simulated)"
    - "A3 theo loại: noi_dia 2.696 đ, hang_nang 8.221 đ, quoc_te 22.515 đ, doi_tac 10.215 đ (simulated)"
    - "Chi phí mỗi việc thành công trong phạm vi 3.414 đ; cộng cố định 4.599 đ ở 45.000 yc/tháng, 5.784 đ ở nửa khối lượng (simulated)"
    - "B4 xem lại 100%: 11.743 đ = 0,98× (12.414 đ = 1,03× nếu làm lại 15,3 phút) (simulated)"
    - "Ngưỡng chi phí 8.000 đ trong luật dừng được đặt từ các số simulated ở trên"
